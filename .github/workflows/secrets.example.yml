# Пример файла с секретами для CI/CD
# ВАЖНО: Это только пример! Замените значения на реальные!

# DockerHub credentials
DOCKERHUB_USERNAME: "your_profile_name_in_dockerHub"
DOCKERHUB_TOKEN: "your_access_token"

# Инструкция по получению токена:
# 1. Войдите в DockerHub
# 2. Перейдите в Account Settings ->Personal access tokens
# 4. Создайте токен с правами на чтение и запись
# 5. Скопируйте токен и сохраните его в безопасном месте

# Как добавить секреты в GitHub:
# 1. Перейдите в настройки вашего репозитория
# 2. Выберите "Secrets and variables" -> "Actions"
# 3. Нажмите "New repository secret"
# 4. Добавьте каждый секрет отдельно:
#    - Name: DOCKERHUB_USERNAME
#    - Value: ваш_логин
#    - Name: DOCKERHUB_TOKEN
#    - Value: ваш_токен 